name: Collect and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Wake daily; the gate below collects when 48 hours have elapsed.
    - cron: '23 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: landscape-radar-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      collection_failed: ${{ steps.collection.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let last;
          try { last=JSON.parse(fs.readFileSync('public/data/opportunities.json')).lastAttempt; } catch {}
          const due=process.env.EVENT_NAME!=='schedule'||!last||Date.now()-Date.parse(last)>=47*3600000;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${due}\n`);
          JS
      - if: steps.gate.outputs.publish == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund
      - if: steps.gate.outputs.publish == 'true'
        run: npm test
      - id: collection
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        run: npm run collect
      - if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update opportunity collection [skip ci]'
            git push
          fi
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: needs.collect.outputs.publish == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing status
        if: needs.collect.outputs.collection_failed == 'true'
        run: |
          echo 'All sources failed. Previous listings and updated error status were published.'
          exit 1
